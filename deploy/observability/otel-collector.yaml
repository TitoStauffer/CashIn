# OpenTelemetry Collector of the production observability stack (DEV-133). Receives OTLP from the API
# on the `observability` network and fans it out to Tempo, Loki and Prometheus on the internal network.
receivers:
  otlp:
    protocols:
      # HTTP only: the API exports OTLP/HTTP. No CORS: no browser sends telemetry here.
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  # Refuses work before the container's memory limit (256M) is reached, instead of being OOM-killed.
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch:

exporters:
  otlp_http/traces:
    endpoint: http://tempo:4318
    tls:
      insecure: true
  otlp_http/logs:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp_http/metrics:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/traces]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/logs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/metrics]
