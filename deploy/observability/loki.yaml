# Loki of the production observability stack (DEV-133): single binary, filesystem storage, 7-day retention.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Retention: log lines older than 7 days are deleted by the compactor below.
  retention_period: 168h
  # Ingestion ceiling, which bounds how fast the disk can fill between compactions.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  compaction_interval: 10m
  retention_delete_delay: 2h

analytics:
  reporting_enabled: false
