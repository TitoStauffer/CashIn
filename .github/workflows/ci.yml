name: CI

on:
  pull_request:
    branches: [master]
    # Human metadata edits rerun the complete CI so a corrected title recovers
    # a blocked PR. App checklist edits use maintenance-only check contexts.
    types: [opened, edited, reopened, synchronize, ready_for_review]
  push:
    branches: [master]

# Least privilege for GITHUB_TOKEN: the jobs only read the repository.
permissions:
  contents: read

# A new push to the same PR cancels the previous run; pushes to master always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Same major version as the Docker images (node:24-alpine), pinned to an exact release.
  NODE_VERSION: "24.22.0"

defaults:
  run:
    # Explicit bash enables -eo pipefail, so a failing command in a pipe fails the step.
    shell: bash

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate PR title and branch key
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          expected='[DEV-123] - título objetivo do ticket'
          pattern='^\[(DEV-[0-9]+)\] - [^[:space:]](.*[^[:space:]])?$'

          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "::error title=Título fora do padrão::O título deve seguir o padrão do AGENTS.md: ${expected}"
            echo "Título recebido: ${PR_TITLE}"
            exit 1
          fi
          title_key="${BASH_REMATCH[1]}"

          branch_pattern='(^|/)(DEV-[0-9]+)(-|$)'
          if [[ ! "${HEAD_REF}" =~ ${branch_pattern} ]]; then
            echo "::error title=Branch sem chave do Jira::A branch '${HEAD_REF}' não contém a chave da issue (ex.: feature/DEV-123-descricao), como exige o AGENTS.md."
            exit 1
          fi
          branch_key="${BASH_REMATCH[2]}"

          if [[ "${title_key}" != "${branch_key}" ]]; then
            echo "::error title=Chave divergente::A chave do título (${title_key}) é diferente da chave da branch (${branch_key})."
            exit 1
          fi

          echo "Título válido para ${title_key}."

      - name: Skip PR metadata validation on master push
        if: github.event_name == 'push'
        run: echo "PR metadata validation is not applicable to a master push."

  automation-tools:
    # Keep the historical check context during rollout because privileged
    # workflow_run jobs execute the trusted version from master.
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.actor == vars.CASHIN_APP_BOT_LOGIN && 'Checklist maintenance / GitHub Reviewer' || 'GitHub Reviewer' }}
    needs: pr-title
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.actor != vars.CASHIN_APP_BOT_LOGIN
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/github-reviewer

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tools/github-reviewer/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Build and test GitHub integration tools
        run: npm test

  api:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.actor == vars.CASHIN_APP_BOT_LOGIN && 'Checklist maintenance / API' || 'API' }}
    needs: pr-title
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.actor != vars.CASHIN_APP_BOT_LOGIN
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    services:
      # Ephemeral database for integration tests. Same image as compose.yaml.
      # Credentials exist only inside this job and are not used anywhere else.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: saldocerto_test
          POSTGRES_USER: saldocerto
          POSTGRES_PASSWORD: saldocerto_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saldocerto -d saldocerto_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # Enables the *.integration.test.ts files; each test creates and drops its own schema
      # and applies the migrations through runMigrations (src/database.ts).
      TEST_DATABASE_URL: postgresql://saldocerto:saldocerto_ci_only@localhost:5432/saldocerto_test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Typecheck
        run: npm run typecheck

      - name: Wait for PostgreSQL
        # The runner already waits for the service health check; this confirms the
        # connection from Node with the same driver the tests use.
        run: |
          for attempt in $(seq 1 30); do
            if node -e "const { Client } = require('pg'); const c = new Client({ connectionString: process.env.TEST_DATABASE_URL }); c.connect().then(() => c.query('SELECT 1')).then(() => c.end()).then(() => process.exit(0), () => process.exit(1));"; then
              echo "PostgreSQL is ready."
              exit 0
            fi
            echo "Waiting for PostgreSQL (attempt ${attempt})..."
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready."
          exit 1

      - name: Test with coverage (unit + integration)
        # Single run of the suite: it validates the code and produces the LCOV report for SonarQube.
        # The log feeds the skipped-test check below.
        run: |
          mkdir -p coverage
          npm run test:coverage 2>&1 | tee "${RUNNER_TEMP}/api-test.log"

      - name: Ensure no test was skipped
        # Integration tests skip themselves when TEST_DATABASE_URL is missing.
        # Fail instead of reporting a green run that never touched the database.
        run: |
          summary=$(grep -E '^(#|ℹ) skipped [0-9]+$' "${RUNNER_TEMP}/api-test.log" | tail -n 1)
          if [ -z "${summary}" ]; then
            echo "::error::Could not find the test summary line."
            exit 1
          fi
          skipped=${summary##* }
          if [ "${skipped}" != "0" ]; then
            echo "::error::${skipped} test(s) were skipped. Integration tests must run in CI."
            exit 1
          fi
          echo "No skipped tests."

      - name: Prepare coverage report for SonarQube
        # SonarQube needs paths relative to the repository root in a monorepo (apps/api/src/...).
        run: |
          test -s coverage/lcov.info
          sed -i 's#^SF:src/#SF:apps/api/src/#' coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-coverage
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: npm run build

  web:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.actor == vars.CASHIN_APP_BOT_LOGIN && 'Checklist maintenance / Web' || 'Web' }}
    needs: pr-title
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.actor != vars.CASHIN_APP_BOT_LOGIN
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Prepare coverage report for SonarQube
        # SonarQube needs paths relative to the repository root in a monorepo (apps/web/src/...).
        run: |
          test -s coverage/lcov.info
          sed -i 's#^SF:src/#SF:apps/web/src/#' coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Typecheck and build
        # The build script runs tsc -b before vite build.
        run: npm run build

  sonarqube:
    name: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.actor == vars.CASHIN_APP_BOT_LOGIN && 'Checklist maintenance / SonarQube' || 'SonarQube' }}
    needs: [api, web, automation-tools]
    # Secrets are not available to PRs from forks; skip instead of failing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarQube Cloud can detect new code and assign blame.
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-coverage
          path: apps/api/coverage

      - name: Download Web coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-coverage
          path: apps/web/coverage

      - name: SonarQube Cloud scan
        # The scanner waits for the Quality Gate so a failure is visible as a failed PR check.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
