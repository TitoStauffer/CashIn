name: Recover Agent Report Publication

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run ID of Codex Agent Orchestration that produced the artifact
        required: true
        type: string
      pr_number:
        description: Pull Request number bound to the artifact
        required: true
        type: string
      stage:
        description: Existing artifact to publish without another model call
        required: true
        type: choice
        options:
          - codeReview
          - qa
          - qualityGate

permissions: {}

concurrency:
  group: recover-agent-report-${{ inputs.pr_number }}-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  publish-existing-evidence:
    name: Publish existing ${{ inputs.stage }} evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Download the selected artifact from the trusted source run.
      checks: read # Recompute the current review context before publication.
      contents: read # Checkout trusted publisher code from master.
      pull-requests: read # Confirm the open PR, HEAD and structured evidence.
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          token: ${{ github.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"

      - name: Install trusted publisher dependencies
        working-directory: tools/github-reviewer
        run: npm ci --fetch-timeout=15000 --fetch-retries=1

      - name: Build trusted publisher
        working-directory: tools/github-reviewer
        run: npm run build

      - name: Download existing stage result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-${{ inputs.stage == 'codeReview' && 'code-review' || inputs.stage == 'qualityGate' && 'quality-gate' || 'qa' }}-${{ inputs.source_run_id }}
          path: tools/github-reviewer/agent-result
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Publish existing result idempotently
        working-directory: tools/github-reviewer
        env:
          AGENT_PUBLISH_MODE: ${{ inputs.stage == 'codeReview' && 'formalReview' || 'report' }}
          AGENT_RESULT_PATH: agent-result/agent-result.json
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          CASHIN_APP_ID: ${{ secrets.CASHIN_APP_ID }}
          CASHIN_APP_INSTALLATION_ID: ${{ secrets.CASHIN_APP_INSTALLATION_ID }}
          CASHIN_APP_PRIVATE_KEY: ${{ secrets.CASHIN_APP_PRIVATE_KEY }}
          CASHIN_APP_BOT_LOGIN: ${{ vars.CASHIN_APP_BOT_LOGIN }}
        run: node dist/agent-publish-cli.js
