name: PR title

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] — trusted default-branch workflow; it never checks out or executes PR code.
    branches: [master]
    # Full CI validates the title for code changes. This workflow handles only
    # metadata edits, including the App's approval-checkbox synchronization.
    types: [edited]

# Permissions are assigned per job. PR-controlled source is never checked out.
permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write

    steps:
      - name: Validate PR title (AGENTS.md)
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          expected='[DEV-123] - título objetivo do ticket'
          pattern='^\[(DEV-[0-9]+)\] - [^[:space:]](.*[^[:space:]])?$'

          if [[ ! "${PR_TITLE}" =~ ${pattern} ]]; then
            echo "description=Título fora do padrão do AGENTS.md." >> "${GITHUB_OUTPUT}"
            echo "::error title=Título fora do padrão::O título deve seguir o padrão do AGENTS.md: ${expected}"
            echo "Título recebido: ${PR_TITLE}"
            exit 1
          fi
          title_key="${BASH_REMATCH[1]}"

          branch_pattern='(^|/)(DEV-[0-9]+)(-|$)'
          if [[ ! "${HEAD_REF}" =~ ${branch_pattern} ]]; then
            echo "description=Branch sem chave Jira compatível." >> "${GITHUB_OUTPUT}"
            echo "::error title=Branch sem chave do Jira::A branch '${HEAD_REF}' não contém a chave da issue (ex.: feature/DEV-123-descricao), como exige o AGENTS.md."
            exit 1
          fi
          branch_key="${BASH_REMATCH[2]}"

          if [[ "${title_key}" != "${branch_key}" ]]; then
            echo "description=Chaves Jira divergentes no título e na branch." >> "${GITHUB_OUTPUT}"
            echo "::error title=Chave divergente::A chave do título (${title_key}) é diferente da chave da branch (${branch_key})."
            exit 1
          fi

          echo "description=Título e branch válidos para ${title_key}." >> "${GITHUB_OUTPUT}"
          echo "Título válido para ${title_key}."

      - name: Publish PR title status on the current HEAD
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_STATE: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
          STATUS_DESCRIPTION: ${{ steps.validate.outputs.description || 'Não foi possível validar o título do PR.' }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${STATUS_STATE}" \
            -f context='PR title' \
            -f description="${STATUS_DESCRIPTION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  recover-ci:
    name: Recover CI after metadata edit
    needs: pr-title
    if: github.actor != vars.CASHIN_APP_BOT_LOGIN
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write

    steps:
      - name: Rerun latest CI for current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            run=$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100" \
                --jq "[.workflow_runs[] | select(any(.pull_requests[]?; .number == ${PR_NUMBER}))] | sort_by(.created_at) | reverse | .[0] | [.id, .status] | @tsv"
            )
            run_id=${run%%$'\t'*}
            run_status=${run#*$'\t'}

            if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
              echo "CI run not visible yet (attempt ${attempt}/12)."
              sleep 5
              continue
            fi

            if [[ "${run_status}" != "completed" ]]; then
              echo "CI run ${run_id} is already ${run_status}; its completion will use current PR metadata."
              exit 0
            fi

            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun"
            echo "Requested CI rerun ${run_id} for PR #${PR_NUMBER} at ${HEAD_SHA}."
            exit 0
          done

          echo "::error::Could not find the CI run associated with PR #${PR_NUMBER} at ${HEAD_SHA}."
          exit 1
