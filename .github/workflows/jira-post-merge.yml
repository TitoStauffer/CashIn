name: Jira post-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] — required for post-merge events from forks; the job gates on merged PRs to master, checks out only trusted master, never checks out or executes PR code, and exposes Jira secrets only to the compiled trusted CLI step.
    types: [closed]
    branches: [master]

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read

concurrency:
  group: jira-post-merge-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  close-jira-issue:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: tools/jira-dispatcher
    steps:
      - name: Checkout trusted master code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: tools/jira-dispatcher/package-lock.json

      - name: Install dispatcher dependencies
        run: npm ci

      - name: Build dispatcher without credentials
        run: npm run build

      - name: Close associated Jira issue
        run: node dist/post-merge-cli.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_APP_BOT_LOGIN: ${{ vars.CASHIN_APP_BOT_LOGIN }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
