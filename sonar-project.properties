# SonarQube Cloud analysis, run by the "SonarQube" job in .github/workflows/ci.yml.
# The token comes from the SONAR_TOKEN GitHub secret, never from this file.
# See docs/ci.md, section "SonarQube Cloud".

sonar.organization=titostauffer
sonar.projectKey=TitoStauffer_CashIn
sonar.sourceEncoding=UTF-8

# Production code of the API, the Web app and the mobile app (DEV-141).
sonar.sources=apps/api/src,apps/web/src,apps/mobile/src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*-test-fixture.ts,**/node_modules/**,**/dist/**,**/coverage/**

# API tests live next to the code (*.test.ts and *.integration.test.ts). A `*-test-fixture.ts` holds
# only fakes and helpers for those tests: it carries no case of its own, so measuring it as production
# code would dilute the coverage signal with code that exists only to exercise other code.
sonar.tests=apps/api/src,apps/web/src,apps/mobile/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*-test-fixture.ts

# TypeScript projects used for type-aware analysis.
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.app.json,apps/web/tsconfig.node.json,apps/mobile/tsconfig.json

# API, Web and Mobile coverage (LCOV), produced by each app's `npm run test:coverage` job with paths
# rewritten relative to the repository root (apps/api/src/..., apps/web/src/... and apps/mobile/src/...).
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info

# Expo Router route files (apps/mobile/src/app) only wire a screen to a path: every file there is a
# route, so screens and their tests live outside it, and the routes stay out of coverage like the
# Jest configuration excludes them.
sonar.coverage.exclusions=apps/mobile/src/app/**
