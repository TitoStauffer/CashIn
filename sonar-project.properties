# Preparation for a future SonarQube Community Build analysis.
# Not used by CI yet: no scanner runs and no server is configured.
# Host URL and token must come from GitHub secrets (SONAR_HOST_URL, SONAR_TOKEN), never from this file.
# See docs/ci.md, section "SonarQube".

# Define the key when the project is created on the server.
sonar.projectKey=saldo-certo
sonar.projectName=Saldo Certo
sonar.sourceEncoding=UTF-8

# Production code of the API and the Web app. Mobile is out of scope.
sonar.sources=apps/api/src,apps/web/src
sonar.exclusions=**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**

# API tests live next to the code (*.test.ts and *.integration.test.ts).
sonar.tests=apps/api/src
sonar.test.inclusions=**/*.test.ts

# TypeScript projects used for type-aware analysis.
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.app.json,apps/web/tsconfig.node.json

# API coverage (LCOV). Paths inside the report must be relative to the repository root
# (apps/api/src/...); docs/ci.md explains how to generate it.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
