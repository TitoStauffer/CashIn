name: saldo-certo

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saldocerto}
      POSTGRES_USER: ${POSTGRES_USER:-saldocerto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saldo_dev_only}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saldocerto} -d ${POSTGRES_DB:-saldocerto}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    # Reinstalls dependencies when the lockfile changed since the node_modules volume was filled.
    command: ["sh", "./scripts/dev-container.sh"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-saldocerto}:${POSTGRES_PASSWORD:-saldo_dev_only}@db:5432/${POSTGRES_DB:-saldocerto}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Traces and logs to the local LGTM stack (DEV-132). Set OTEL_EXPORTER_OTLP_ENDPOINT to an empty
      # value in .env to run the API without telemetry; the API never waits for this service.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://observability:4318}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      OTEL_SERVICE_NAME: saldocerto-api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Room for an npm ci after a dependency change (scripts/dev-container.sh).
      start_period: 180s

  web:
    build:
      context: ./apps/web
    environment:
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # Grafana, Loki, Tempo and Prometheus in one development image, receiving OTLP from the API over the
  # compose network. Only Grafana is published, and only on 127.0.0.1. Development only: production uses
  # separate components with authentication (DEV-133).
  observability:
    image: grafana/otel-lgtm:0.40.0@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - observability_data:/data

volumes:
  postgres_data:
  observability_data:
  api_node_modules:
  web_node_modules:
